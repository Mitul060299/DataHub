groups:
  - name: datahub-alerts
    rules:
      - alert: BackendHighLatency
        expr: histogram_quantile(0.95, sum(rate(datahub_http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency"
          description: "95th percentile API latency > 2s for 5 minutes"
      - alert: BackendErrorRate
        expr: sum(rate(datahub_http_requests_total{status_code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "API 5xx errors > 1 req/sec for 5 minutes"

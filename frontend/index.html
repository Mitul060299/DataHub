    <script type="application/ld+json">

      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DataHub",
        "url": "https://datahub.org.in",
        "logo": {
          "@type": "ImageObject",
          "url": "https://datahub.org.in/logo.png",
          "width": 512,
          "height": 512

        "description": "AI-powered data analysis and pipeline automation. Ask in plain English — DataHub generates transparent, step-by-step SQL plans you approve before anything runs.",

        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DataHub",
        "url": "https://datahub.org.in",
        "description": "AI-powered data analysis platform. Connect CSV, Excel, PostgreSQL, Snowflake, BigQuery and more.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://datahub.org.in/docs?page={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DataHub",
        "applicationCategory": "BusinessApplication",

          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free plan with 100 AI messages/month, 500 MB storage, CSV & Excel uploads. No credit card required."

        "featureList": [
          "AI-powered SQL generation with step-by-step plan preview",
          "Replayable, auditable data pipelines",
          "PostgreSQL, MySQL, Snowflake, BigQuery, Redshift connectors",

          "Cross-dataset dashboards and visualizations",
          "Team collaboration with roles and permissions",
          "Full audit log and data lineage tracking",
          "SOC2-ready governance controls"
        ]
      }
    ]

        <h1>DataHub &mdash; The Simple and Reliable Way to Prepare &amp; Analyse Your Data</h1>
        <p>DataHub is an AI-powered data analysis platform that cleans, transforms, and analyses your business data in plain English. Every transformation runs as readable, auditable SQL that you review and approve before anything executes &mdash; no black boxes, no guesswork.</p>
        <h2>What DataHub does</h2>
        <ul>
          <li>Upload CSV, Excel, JSON, or Parquet files &mdash; or connect PostgreSQL, MySQL, Snowflake, BigQuery, Redshift, MSSQL, Oracle</li>
          <li>Ask questions in plain English: DataHub generates a step-by-step SQL plan you approve before it runs</li>
          <li>30+ built-in transformation operations: deduplication, type inference, null handling, encoding repair, column standardisation, joins, pivots, and more</li>
          <li>Replayable, auditable data pipelines with full lineage tracking</li>
          <li>Cross-dataset dashboards and shareable visualisations</li>
          <li>Team collaboration with RBAC, audit logs, and approval workflows</li>
        </ul>
        <h2>Pricing</h2>
        <p>Free plan available (no credit card required). Paid plans from &#8377;999/month. 15-day free trial on all paid plans.</p>
        <h2>Frequently asked questions</h2>
        <dl>
          <dt>Is DataHub a black box?</dt>
          <dd>No. Every action is a named step shown to you before it runs. You see the exact SQL, then Approve, Edit, or Reject. Nothing runs without your go-ahead.</dd>
          <dt>Will AI hallucinate results?</dt>
          <dd>DataHub runs real, deterministic SQL on your actual data. The AI writes the query; your data produces the result. No invented rows, no guessing.</dd>
          <dt>What file types does DataHub support?</dt>
          <dd>CSV, Excel (.xlsx/.xls, including multi-sheet), JSON, Parquet, and direct database connections.</dd>
          <dt>Is my data safe?</dt>
          <dd>Data is stored in encrypted, isolated cloud storage. We never share data between accounts and never use your data to train AI models.</dd>
          <dt>Is there a free plan?</dt>
          <dd>Yes. The Free plan costs &#8377;0/month with no credit card required. It includes 50 AI messages/month and 500 MB storage.</dd>
        </dl>

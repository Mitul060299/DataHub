apiVersion: v1
kind: Service
metadata:
  name: {{ include "datahub.backendFullname" . }}
  labels:
    app: {{ include "datahub.backendName" . }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: {{ include "datahub.backendName" . }}

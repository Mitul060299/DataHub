<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet" />

    <!-- ── Primary meta ─────────────────────────────── -->
    <title>DataHub – The data tool that shows you exactly what it's doing</title>
    <meta name="description" content="Describe what you want. DataHub builds a step-by-step plan with the exact SQL, then executes it — no black boxes." />
    <link rel="canonical" href="https://datahub.org.in/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ── Favicon / app icon ───────────────────────── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Open Graph (used by Google for rich results) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://datahub.org.in/" />
    <meta property="og:title" content="DataHub" />
    <meta property="og:description" content="The data tool that lets you see exactly what it's doing." />
    <meta property="og:image" content="https://datahub.org.in/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- ── Organisation structured data (Google sitelinks logo) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DataHub",
      "url": "https://datahub.org.in",
      "logo": {
        "@type": "ImageObject",
        "url": "https://datahub.org.in/logo.png",
        "width": 512,
        "height": 512
      },
      "description": "The data tool that lets you see exactly what it's doing. Describe what you want. DataHub builds a step-by-step plan with the exact SQL.",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

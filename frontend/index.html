        <h1>DataHub &mdash; AI Tool for Analysts | Clean Excel Files, Merge CSVs, Automate Data Work</h1>
        <p>DataHub is the AI-powered data transformation tool for analysts, accountants, and consultants. Clean messy Excel files, merge multiple CSVs, remove duplicates, standardize column names, and automate repetitive reporting workflows &mdash; all without writing code. Every step runs as readable, auditable SQL you review and approve.</p>
        <h2>What analysts use DataHub for</h2>
        <ul>
          <li>Clean messy Excel files and CSVs in minutes &mdash; fix nulls, mixed types, broken encodings, merged cells</li>
          <li>Merge multiple CSV or Excel files automatically without VLOOKUP or copy-paste</li>
          <li>Remove exact and near-duplicate rows from any dataset</li>
          <li>Standardize column names across multiple exports automatically</li>
          <li>Prepare raw data for Power BI, Tableau, and Google Sheets dashboards</li>
          <li>Automate monthly Excel reconciliation and reporting with reusable pipelines</li>
          <li>Transform accounting software exports (QuickBooks, Tally, Xero, SAP) into clean analysis-ready tables</li>
          <li>Schedule data cleanup to run daily, weekly, or monthly on fresh files</li>
          <li>Connect to live databases: PostgreSQL, MySQL, Snowflake, BigQuery, Redshift, MSSQL, Oracle</li>
        </ul>
        <h2>Pricing</h2>
        <p>Free plan available (no credit card required). Paid plans from &#8377;999/month. 15-day free trial on all paid plans.</p>
        <h2>Frequently asked questions</h2>
        <dl>
          <dt>Is DataHub a black box?</dt>
          <dd>No. Every action is a named step shown to you before it runs. You see the exact SQL, then Approve, Edit, or Reject. Nothing runs without your go-ahead.</dd>
          <dt>Will AI hallucinate results?</dt>
          <dd>DataHub runs real, deterministic SQL on your actual data. The AI writes the query; your data produces the result. No invented rows, no guessing.</dd>
          <dt>What file types does DataHub support?</dt>
          <dd>CSV, Excel (.xlsx/.xls, including multi-sheet), JSON, Parquet, and direct database connections.</dd>
          <dt>Is my data safe?</dt>
          <dd>Data is stored in encrypted, isolated cloud storage. We never share data between accounts and never use your data to train AI models.</dd>
          <dt>Is there a free plan?</dt>
          <dd>Yes. The Free plan costs &#8377;0/month with no credit card required. It includes 50 AI messages/month and 500 MB storage.</dd>
        </dl>

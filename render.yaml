services:
  - type: web
    name: datahub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore        # closest Render region to India (~60ms vs ~300ms from oregon)
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: RUN_MIGRATIONS
        value: "0"
      - key: LLM_ROUTER_ENABLED
        value: "true"
    # /health is the lightweight liveness probe (no DB touch, returns immediately).
    # Previously this was set to /api/health which DOES NOT EXIST — every Render
    # health probe 404'd, and after consecutive failures Render SIGKILL'd the
    # instance, leaving no Python traceback in the logs (just an unexplained
    # "[entrypoint] Starting backend" line on the next deploy attempt).
    healthCheckPath: /health
